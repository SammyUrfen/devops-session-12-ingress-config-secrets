# Dummy values only. A real Secret must never be committed to Git.
# data values are base64, made with: echo -n '<value>' | base64
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
type: Opaque
data:
  DB_USER: ZGVtby11c2Vy                          # demo-user
  DB_PASSWORD: ZGVtby1wYXNzd29yZC1ub3QtcmVhbA==  # demo-password-not-real
---
apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef: { name: db-secret, key: DB_USER }
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: { name: db-secret, key: DB_PASSWORD }
      volumeMounts:
        - name: creds
          mountPath: /etc/creds
          readOnly: true
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 50m, memory: 64Mi }
  volumes:
    - name: creds
      secret:
        secretName: db-secret
