apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # Single keys, read as environment variables
  ENVIRONMENT: "staging"
  LOG_LEVEL: "DEBUG"
  MAX_BOOKING_DAYS: "30"
  # A whole file, mounted as /etc/app/app.properties
  app.properties: |
    cache.ttl.seconds=120
    feature.dark_mode=true
---
apiVersion: v1
kind: Pod
metadata:
  name: configmap-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      envFrom:
        - configMapRef:
            name: app-config
      volumeMounts:
        - name: config
          mountPath: /etc/app
          readOnly: true
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 50m, memory: 64Mi }
  volumes:
    - name: config
      configMap:
        name: app-config
        items:
          - key: app.properties
            path: app.properties
