# BROKEN on purpose. The password was encoded with: echo "demo-password-not-real" | base64
# (no -n), so the stored value ends with a newline byte (base64 ends in "Cg==").
apiVersion: v1
kind: Secret
metadata:
  name: app-db-secret
type: Opaque
data:
  DB_PASSWORD: ZGVtby1wYXNzd29yZC1ub3QtcmVhbAo=
---
apiVersion: v1
kind: Pod
metadata:
  name: db-client
spec:
  restartPolicy: Never
  containers:
    - name: psql
      image: postgres:16-alpine
      command: ["sh", "-c", "psql -h pg -U demo-user -d postgres -c 'select 1 as connected'"]
      env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef: { name: app-db-secret, key: DB_PASSWORD }
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 100m, memory: 64Mi }
